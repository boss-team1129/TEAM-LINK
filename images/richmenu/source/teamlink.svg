          <stop offset="0" stop-color="#fff9ec"/><stop offset=".52" stop-color="#faedef"/><stop offset="1" stop-color="#eee9f8"/>
        </linearGradient>
        <linearGradient id="ivoryCard" x1="0" y1="0" x2="0" y2="1">
